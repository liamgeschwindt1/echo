name: Simulator regression

on:
  pull_request:
    paths:
      - 'packages/sim-core/**'
      - 'packages/shared/**'
      - 'packages/assets/**'
      - 'apps/sim/**'
      - 'scripts/benchmark*.mjs'
      - 'scripts/lib/**'
      - 'scripts/recording.mjs'
      - 'scripts/train-confidence.mjs'
      - 'docs/targets.json'
      - 'docs/experiments/ci-smoke.json'
      - 'baselines/ci-smoke.json'
      - 'package*.json'
      - '.github/workflows/sim-regression.yml'
  push:
    branches: [main, overnight/localisation, overnight/localisation-2, overnight/localisation-4]
    paths:
      - 'packages/sim-core/**'
      - 'packages/shared/**'
      - 'packages/assets/**'
      - 'apps/sim/**'
      - 'scripts/benchmark*.mjs'
      - 'scripts/lib/**'
      - 'scripts/recording.mjs'
      - 'scripts/train-confidence.mjs'
      - 'docs/targets.json'
      - 'docs/experiments/ci-smoke.json'
      - 'baselines/ci-smoke.json'
      - 'package*.json'
      - '.github/workflows/sim-regression.yml'
  workflow_dispatch:
  schedule:
    - cron: '20 2 * * *'

permissions:
  contents: read

concurrency:
  group: sim-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: npm
      - run: npm ci
      - run: npm run fetch-test-audio -w @echo/assets
      - name: Re-score stored CI baseline with current scoring
        run: node scripts/benchmark-rescore.mjs --from baselines/ci-smoke.json --out artifacts/ci-smoke-baseline.json
      - run: npm test -w @echo/sim-core
      - run: npm test -w @echo/sim
      - run: npm run build -w @echo/sim
      - name: Verify archived single-attempt sealed evidence
        run: node scripts/verify-round2-sealed.mjs
      - run: npx playwright install --with-deps chromium
      - name: Browser/CLI consensus, sweep and recording parity
        run: npm run test:testing:e2e -w @echo/sim
      - name: Compare finite measured-only fixes, realism off and on
        run: >-
          npm run benchmark --
          --experiment docs/experiments/ci-smoke.json
          --compare artifacts/ci-smoke-baseline.json
          --fail-on-regress
          --discard-renders
          --out artifacts/ci-smoke.json
      - name: Nightly fixed-population measured benchmark (never sealed)
        if: github.event_name == 'schedule'
        run: >-
          npm run benchmark --
          --experiment docs/experiments/nightly-standard.json
          --discard-renders
          --cache .benchmark-nightly
          --out artifacts/nightly-standard.json
      - name: Nightly compact benchmark history
        if: github.event_name == 'schedule'
        run: node scripts/benchmark-history.mjs artifacts/nightly-standard.json
      - name: Preserve reports on success or regression
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-regression
          path: |
            artifacts/ci-smoke.*
            artifacts/ci-smoke-baseline.*
            artifacts/nightly-standard.*
            docs/benchmark-history.json
          if-no-files-found: warn
